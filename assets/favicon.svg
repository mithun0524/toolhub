<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" aria-hidden="true">
  <rect width="100" height="100" rx="24" fill="#0b0b0c"/>
  <!-- Slashed zero: narrow ellipse + a slash that overshoots it. A circle with a
       slash inside its bounds reads as a "prohibited" sign instead. -->
  <ellipse cx="50" cy="50" rx="21" ry="29" stroke="#ffb020" stroke-width="8.5"/>
  <path d="M36 74 64 26" stroke="#ffb020" stroke-width="8.5" stroke-linecap="round"/>
</svg>
