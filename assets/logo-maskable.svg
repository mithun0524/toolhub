  <rect width="100" height="100" fill="#0b0b0c"/>
  <ellipse cx="50" cy="50" rx="16" ry="22" stroke="#ffb020" stroke-width="6.5"/>
  <path d="M39 68 61 32" stroke="#ffb020" stroke-width="6.5" stroke-linecap="round"/>
</svg>
