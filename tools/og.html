<!DOCTYPE html>
<!-- Source for assets/og.png. Rendered by tools/make-icons.sh at 1200x630.
     Mirrors the site masthead: left-aligned statement, spec table down the
     right, no glow. A share card that looks like a different product than the
     page it opens is worse than no share card. -->
<html><head><meta charset="utf-8"/><style>
  @font-face { font-family:'JetBrains Mono'; src:url('../assets/fonts/jetbrainsmono.woff2') format('woff2'); font-weight:400 600; }
  @font-face { font-family:'Bricolage'; src:url('../assets/fonts/bricolage.woff2') format('woff2'); font-weight:400 800; }
  @font-face { font-family:'PublicSans'; src:url('../assets/fonts/publicsans.woff2') format('woff2'); font-weight:400 700; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1200px; height:630px; background:#0b0b0c; color:#fafaf9;
    font-family:'PublicSans', sans-serif; overflow:hidden;
    display:flex; flex-direction:column; padding:64px 72px;
  }
  header { display:flex; align-items:center; gap:14px; }
  header svg { width:30px; height:30px; }
  .word { font-family:'JetBrains Mono', monospace; font-size:22px; font-weight:600; letter-spacing:3px; }
  main { flex:1; display:flex; align-items:flex-end; justify-content:space-between; gap:56px; }
  h1 {
    font-family:'Bricolage', sans-serif; font-size:88px; font-weight:800;
    letter-spacing:-3.4px; line-height:0.97;
  }
  h1 em { font-style:normal; color:#ffb020; }
  .spec { width:400px; flex:none; }
  .spec-row {
    display:flex; align-items:baseline; gap:10px;
    padding:13px 0; border-top:1px solid #26262a; font-size:19px;
  }
  .spec-row:last-child { border-bottom:1px solid #26262a; }
  .spec-row dt { color:#71717a; white-space:nowrap; }
  .spec-row span { flex:1; height:1px; margin-bottom:5px;
    background:repeating-linear-gradient(90deg,#26262a 0 2px, transparent 2px 5px); }
  .spec-row dd { font-family:'JetBrains Mono', monospace; font-weight:600; }
  .spec-row dd.yes { color:#ffb020; }
</style></head><body>
  <header>
    <svg viewBox="0 0 24 24" fill="none">
      <ellipse cx="12" cy="12" rx="5.4" ry="7.6" stroke="#ffb020" stroke-width="2.1"/>
      <path d="M8.4 18.2 15.6 5.8" stroke="#ffb020" stroke-width="2.1" stroke-linecap="round"/>
    </svg>
    <span class="word">NOUGHT</span>
  </header>
  <main>
    <h1>Eighteen tools.<br>None of them<br><em>phone home.</em></h1>
    <dl class="spec">
      <div class="spec-row"><dt>Files uploaded</dt><span></span><dd>0</dd></div>
      <div class="spec-row"><dt>Accounts</dt><span></span><dd>0</dd></div>
      <div class="spec-row"><dt>Third-party requests</dt><span></span><dd>0</dd></div>
      <div class="spec-row"><dt>Works offline</dt><span></span><dd class="yes">yes</dd></div>
    </dl>
  </main>
</body></html>
